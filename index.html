<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ef">
  <title>Colores — tu paleta</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #20211f; background: #f6f4ef; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 32px 18px; }
    main { width: min(760px, 100%); }
    .eyebrow { color: #75746d; font-size: .76rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 10px 0 8px; font-size: clamp(2.2rem, 7vw, 4rem); letter-spacing: -.065em; line-height: 1; }
    .intro { margin: 0; color: #6d6c66; font-size: 1.05rem; }
    .palette { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin: 34px 0 24px; }
    .swatch { min-width: 0; }
    .color { height: clamp(130px, 28vw, 220px); border-radius: 18px; box-shadow: inset 0 0 0 1px #0000000d; }
    .hex { display: block; width: 100%; margin-top: 10px; padding: 8px 3px; border: 0; border-radius: 8px; background: transparent; color: #383832; font: 700 .83rem ui-monospace, SFMono-Regular, Consolas, monospace; text-align: center; cursor: pointer; }
    .hex:hover, .hex:focus-visible { background: #e9e6de; outline: none; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    button { border: 0; border-radius: 999px; padding: 13px 20px; font: inherit; font-weight: 700; cursor: pointer; transition: transform .15s, background .15s; }
    button:hover { transform: translateY(-1px); }
    .generate { background: #23241f; color: white; }
    .generate:hover { background: #41423a; }
    .hint { color: #77766f; font-size: .88rem; }
    #notice { min-height: 1.3em; margin-top: 13px; color: #55745a; font-size: .9rem; }
    @media (max-width: 520px) { .palette { gap: 7px; } .color { border-radius: 11px; } .hex { font-size: .68rem; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Una herramienta pequeña para ideas grandes</div>
    <h1>Tu próxima paleta.</h1>
    <p class="intro">Cinco colores al azar. Haz clic en un código para copiarlo.</p>
    <section class="palette" id="palette" aria-label="Paleta de colores"></section>
    <div class="actions">
      <button class="generate" id="generate" type="button">Generar colores <span aria-hidden="true">↗</span></button>
      <span class="hint">También puedes pulsar la barra espaciadora.</span>
    </div>
    <div id="notice" role="status" aria-live="polite"></div>
  </main>
  <script>
    const palette = document.querySelector('#palette');
    const notice = document.querySelector('#notice');
    const randomHex = () => '#' + Math.floor(Math.random() * 0x1000000).toString(16).padStart(6, '0').toUpperCase();

    function generatePalette() {
      palette.replaceChildren();
      for (let i = 0; i < 5; i++) {
        const hex = randomHex();
        const swatch = document.createElement('div');
        swatch.className = 'swatch';
        const color = document.createElement('div');
        color.className = 'color';
        color.style.backgroundColor = hex;
        const code = document.createElement('button');
        code.className = 'hex';
        code.type = 'button';
        code.textContent = hex;
        code.setAttribute('aria-label', `Copiar el color ${hex}`);
        code.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(hex);
            notice.textContent = `${hex} copiado al portapapeles`;
          } catch {
            notice.textContent = `Código de color: ${hex}`;
          }
        });
        swatch.append(color, code);
        palette.append(swatch);
      }
      notice.textContent = '';
    }

    document.querySelector('#generate').addEventListener('click', generatePalette);
    document.addEventListener('keydown', (event) => {
      if (event.code === 'Space' && !['BUTTON', 'INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
        event.preventDefault();
        generatePalette();
      }
    });
    generatePalette();
  </script>
</body>
</html>
